name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Tự tìm thư mục chứa settings.gradle(.kts), kể cả khi dự án nằm trong thư mục con
      - name: Find Gradle project
        id: proj
        run: |
          file=$(find . -maxdepth 3 \( -name settings.gradle.kts -o -name settings.gradle \) -not -path './.git/*' | head -n 1)
          if [ -z "$file" ]; then
            echo "::error::Không tìm thấy settings.gradle.kts trong repo. Hãy đẩy đủ các file dự án (app/, build.gradle.kts, settings.gradle.kts, gradle.properties) lên GitHub."
            find . -maxdepth 3 -not -path './.git/*' | head -n 60
            exit 1
          fi
          dir=$(dirname "$file")
          echo "Thư mục dự án: $dir"
          echo "dir=$dir" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # Dùng Gradle cài sẵn bởi action nên không cần file gradle-wrapper.jar
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Build debug APK
        run: gradle -p "${{ steps.proj.outputs.dir }}" assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AutoWebCast-debug-apk
          path: ${{ steps.proj.outputs.dir }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
