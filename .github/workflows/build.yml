name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Nếu repo chỉ chứa file .zip (chưa giải nén) thì tự giải nén vào thư mục _project
      - name: Extract project zip if needed
        run: |
          existing=$(find . -maxdepth 4 \( -name settings.gradle.kts -o -name settings.gradle \) -not -path './.git/*' | head -n 1)
          if [ -z "$existing" ]; then
            zipfile=$(find . -maxdepth 2 -name '*.zip' -not -path './.git/*' | head -n 1)
            if [ -n "$zipfile" ]; then
              echo "Giải nén $zipfile"
              unzip -q -o "$zipfile" -d _project
            fi
          fi

      # Tự tìm thư mục chứa settings.gradle(.kts), kể cả khi dự án nằm trong thư mục con
      - name: Find Gradle project
        id: proj
        run: |
          file=$(find . -maxdepth 4 \( -name settings.gradle.kts -o -name settings.gradle \) -not -path './.git/*' | head -n 1)
          if [ -z "$file" ]; then
            echo "::error::Không tìm thấy settings.gradle.kts trong repo. Hãy đẩy đủ các file dự án (app/, build.gradle.kts, settings.gradle.kts, gradle.properties) hoặc file AutoWebCast.zip lên GitHub."
            find . -maxdepth 3 -not -path './.git/*' | head -n 60
            exit 1
          fi
          dir=$(dirname "$file")
          echo "Thư mục dự án: $dir"
          echo "dir=$dir" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # Dùng Gradle cài sẵn bởi action nên không cần file gradle-wrapper.jar
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      # Maven Central hay trả lỗi 429 (Too Many Requests) cho máy chủ GitHub Actions.
      # Thêm bản sao Maven Central của Google làm nguồn ưu tiên (không cần sửa file dự án).
      - name: Use Maven Central mirror
        run: |
          init_dir="${GRADLE_USER_HOME:-$HOME/.gradle}/init.d"
          mkdir -p "$init_dir"
          cat > "$init_dir/central-mirror.gradle" <<'EOF'
          def mirror = 'https://maven-central.storage-download.googleapis.com/maven2/'
          beforeSettings { settings ->
              settings.pluginManagement.repositories {
                  maven { name = 'CentralMirror'; url = uri(mirror) }
              }
              settings.dependencyResolutionManagement.repositories {
                  maven { name = 'CentralMirror'; url = uri(mirror) }
              }
          }
          EOF

      # Tự thử lại tối đa 3 lần nếu tải thư viện bị lỗi tạm thời
      - name: Build debug APK
        env:
          PROJECT_DIR: ${{ steps.proj.outputs.dir }}
        run: |
          for attempt in 1 2 3; do
            if gradle -p "$PROJECT_DIR" assembleDebug --stacktrace; then
              exit 0
            fi
            echo "::warning::Build lỗi (lần $attempt/3), thử lại sau 30 giây..."
            sleep 30
          done
          exit 1

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AutoWebCast-debug-apk
          path: ${{ steps.proj.outputs.dir }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
